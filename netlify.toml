# Netlify 部署配置 - MyBlog (Shirone 主题, Astro 7)
# 适用 Netlify 的 Astro 静态站点构建
# 参考: https://docs.astro.build/zh-cn/guides/deploy/netlify/

[build]
  # 构建命令
  command = "pnpm build"
  # 输出目录
  publish = "dist"

# Node 版本：Shirone 要求 >= 22.12
[build.environment]
  NODE_VERSION = "22"

# 生产部署
[context.production]
  command = "pnpm build"

# 预览部署（Pull Request）与分支部署
[context.deploy-preview]
  command = "pnpm build"

[context.branch-deploy]
  command = "pnpm build"